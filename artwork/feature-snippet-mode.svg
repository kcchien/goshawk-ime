<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img" aria-label="反引號寫程式示意圖：輸入反引號後優先出英文、標點維持半形、Tab 補完不加多餘空格">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F3236"/>
      <stop offset="100%" stop-color="#204E4E"/>
    </linearGradient>
    <filter id="winShadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061416" flood-opacity="0.34"/>
    </filter>
    <filter id="popShadow" x="-8%" y="-14%" width="116%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A1A1C" flood-opacity="0.22"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="960" height="310" rx="16" fill="url(#bg)"/>

  <!-- Left narrative panel with physical keycaps -->
  <g transform="translate(40, 44)">
    <rect x="0" y="0" width="36" height="36" rx="7" fill="rgba(255,255,255,0.12)" stroke="rgba(244,240,218,0.38)" stroke-width="1.2"/>
    <text x="18" y="27" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#E6AA56">`</text>
    <text x="50" y="28" class="sans" font-size="26" font-weight="600" fill="#F4F0DA">寫程式不切英文</text>
  </g>

  <text x="40" y="106" class="sans" font-size="14" fill="#8FB8A5">打反引號包指令與變數，收尾自動回中文</text>

  <!-- Row 1: Space keycap -->
  <g transform="translate(40, 132)">
    <rect width="88" height="32" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(244,240,218,0.36)"/>
    <text x="44" y="21" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#F4F0DA">␣ 空白</text>
    <text x="106" y="21" class="sans" font-size="14.5" fill="#F4F0DA">優先出英文，保留空白</text>
  </g>

  <!-- Row 2: Tab keycap -->
  <g transform="translate(40, 178)">
    <rect width="88" height="32" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(244,240,218,0.36)"/>
    <text x="44" y="21" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#E6AA56">⇥ Tab</text>
    <text x="106" y="21" class="sans" font-size="14.5" fill="#F4F0DA">補完英文，不加多餘空格</text>
  </g>

  <!-- Row 3: Separate punctuation keycaps -->
  <g transform="translate(40, 224)">
    <rect x="0" y="0" width="28" height="32" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(244,240,218,0.36)"/>
    <text x="14" y="21" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#F4F0DA">,</text>
    <rect x="34" y="0" width="28" height="32" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(244,240,218,0.36)"/>
    <text x="48" y="21" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#F4F0DA">.</text>
    <rect x="68" y="0" width="28" height="32" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(244,240,218,0.36)"/>
    <text x="82" y="21" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#F4F0DA">(</text>
    <text x="112" y="21" class="sans" font-size="14.5" fill="#F4F0DA">標點半形，收尾即恢復</text>
  </g>

  <!-- Right editor window -->
  <g transform="translate(366, 28)" filter="url(#winShadow)">
    <rect width="554" height="254" rx="12" fill="#FFFFFF"/>
    <path d="M12 0 H542 A12 12 0 0 1 554 12 V36 H0 V12 A12 12 0 0 1 12 0 Z" fill="#F3F3F1"/>
    <line x1="0" y1="36" x2="554" y2="36" stroke="#E2E2DE" stroke-width="1"/>
    <circle cx="20" cy="18" r="5.5" fill="#FF5F57"/>
    <circle cx="38" cy="18" r="5.5" fill="#FEBC2E"/>
    <circle cx="56" cy="18" r="5.5" fill="#28C840"/>
    <text x="277" y="23" text-anchor="middle" class="sans" font-size="12.5" font-weight="500" fill="#5A6364">API 規格.md</text>

    <text x="28" y="76" class="sans" font-size="20" fill="#162223">查詢訂單請傳入</text>
    <rect x="176" y="54" width="128" height="30" rx="6" fill="#EEF3F1"/>
    <text x="186" y="76" class="mono" font-size="18" fill="#162223">`order_id`</text>
    <text x="312" y="76" class="sans" font-size="20" fill="#162223">，不可為空。</text>

    <text x="28" y="122" class="sans" font-size="20" fill="#162223">預設欄位為</text>
    <text x="136" y="122" class="mono" font-size="20" fill="#215C52">`</text>
    <text x="150" y="122" class="mono" font-size="20" fill="#162223">id</text>
    <line x1="150" y1="127" x2="176" y2="127" stroke="#215C52" stroke-width="2"/>
    <rect x="177" y="102" width="2" height="24" rx="1" fill="#215C52"/>

    <!-- Authentic Snippet Popover -->
    <g transform="translate(116, 138)" filter="url(#popShadow)">
      <rect width="340" height="86" rx="10" fill="#F8F8F5" stroke="rgba(15,50,54,0.18)" stroke-width="1"/>
      <rect x="12" y="12" width="34" height="20" rx="5" fill="#E4EFEA"/>
      <text x="29" y="26" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#1B5249">片段</text>

      <rect x="54" y="10" width="32" height="24" rx="5" fill="#215C52"/>
      <text x="70" y="27" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#FFFFFF">id</text>

      <rect x="94" y="13" width="36" height="19" rx="4" fill="#FFFFFF" stroke="rgba(15,50,54,0.2)"/>
      <text x="112" y="26" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#4E6062">空白</text>
      <text x="142" y="26" class="sans" font-size="12" fill="#4E6062">idea  ·  ideas</text>

      <line x1="12" y1="43" x2="328" y2="43" stroke="rgba(15,50,54,0.12)" stroke-width="1"/>

      <text x="14" y="68" class="sans" font-size="13" fill="#6B7D7F">戈木</text>
      <text x="52" y="69" class="sans" font-size="17" font-weight="500" fill="#4E6062">床</text>
      <rect x="104" y="54" width="46" height="19" rx="4" fill="#FFFFFF" stroke="rgba(15,50,54,0.2)"/>
      <text x="127" y="67" text-anchor="middle" class="sans" font-size="10" font-weight="600" fill="#4E6062">⇧ Shift</text>
      <text x="157" y="67" text-anchor="middle" class="sans" font-size="10.5" fill="#6B7D7F">+</text>
      <rect x="164" y="54" width="38" height="19" rx="4" fill="#FFFFFF" stroke="rgba(15,50,54,0.2)"/>
      <text x="183" y="67" text-anchor="middle" class="sans" font-size="10" font-weight="600" fill="#4E6062">空白</text>
      <text x="210" y="67" class="sans" font-size="11.5" fill="#6B7D7F">可切回選中文</text>
    </g>
  </g>
</svg>
